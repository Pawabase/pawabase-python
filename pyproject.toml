[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pawabase"
dynamic = ["version"]
description = "Python kit for Pawabase: write, test, deploy and emulate custom functions, and call a Pawabase project."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pawabase contributors" }]
keywords = ["pawabase", "backend", "functions", "serverless", "cli", "emulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
pawabase = "pawabase.cli:main"

[project.urls]
Homepage = "https://github.com/Pawabase/pawabase-python"
Documentation = "https://github.com/Pawabase/pawabase-docs"
Issues = "https://github.com/Pawabase/pawabase-python/issues"

[tool.hatch.version]
path = "pawabase/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pawabase"]

[tool.hatch.build.targets.sdist]
include = ["pawabase", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"
